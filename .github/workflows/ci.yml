name: Integración Continua AgroValle Connect

# Evento: push a main o a ramas de trabajo, y todo Pull Request hacia main.
on:
  push:
    branches: [ main, 'feature/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Este nombre de job es el que se marca como "Required status check" en la regla de protección de main.
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilación limpia
        run: mvn -B clean compile

      - name: Gate 1 - Verificación estática (Checkstyle, 0 advertencias)
        run: mvn -B checkstyle:check

      - name: Gate 2 - Pruebas automatizadas (JUnit 5 y Mockito)
        run: mvn -B test

      - name: Gate 3 - Umbral de cobertura JaCoCo (>= 60% instrucciones y ramas)
        run: mvn -B jacoco:check

      - name: Publicar el reporte HTML de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore
